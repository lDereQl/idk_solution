services:
  api:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ${DATA_SRC:-./data}:/srv/data   # make run/up: ./demo_data; drop real exports in ./data; empty/missing -> stub data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 2s
      retries: 30
